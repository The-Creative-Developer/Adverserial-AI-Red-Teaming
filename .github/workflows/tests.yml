name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Demo smoke test (exits non-zero if the secure mode leaks)
        run: python demo/assistant.py --no-color
      - name: Probe scan (exits non-zero if any attack beats the secure mode)
        run: python demo/scan.py --no-color
